<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" fill="#0b0d0f"/>

  <!-- Agent nodes (circles) -->
  <circle cx="20" cy="20" r="6" fill="#4f46e5"/>
  <circle cx="44" cy="20" r="6" fill="#4f46e5"/>
  <circle cx="32" cy="40" r="6" fill="#4f46e5"/>

  <!-- Connections (lines) -->
  <line x1="20" y1="20" x2="44" y2="20" stroke="#4f46e5" stroke-width="1.5" opacity="0.6"/>
  <line x1="20" y1="20" x2="32" y2="40" stroke="#4f46e5" stroke-width="1.5" opacity="0.6"/>
  <line x1="44" y1="20" x2="32" y2="40" stroke="#4f46e5" stroke-width="1.5" opacity="0.6"/>

  <!-- Central pulse/indicator -->
  <circle cx="32" cy="32" r="3" fill="#6366f1" opacity="0.8"/>
</svg>
